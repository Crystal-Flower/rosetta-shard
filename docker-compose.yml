version: '3.8'

services:
  qdrant-cloud:
    image: qdrant/qdrant:latest
    container_name: rosetta-qdrant-cloud
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  cloud-api:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    container_name: rosetta-cloud-api
    ports:
      - "8001:8001"
    environment:
      - QDRANT_HOST=qdrant-cloud
      - QDRANT_PORT=6333
    depends_on:
      - qdrant-cloud
    restart: unless-stopped

volumes:
  qdrant_storage:
